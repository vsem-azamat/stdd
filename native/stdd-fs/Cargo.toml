[package]
name = "stdd-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Protocol-v1 capability filesystem helper with v2 identities for stdd"

[dependencies]
base64 = "0.22.1"
libc = "0.2.186"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
