[package]
name = "stdd-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Protocol-v1 capability filesystem helper with v2 identities for stdd"

[dependencies]
base64 = "0.22.1"
libc = "0.2.186"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
