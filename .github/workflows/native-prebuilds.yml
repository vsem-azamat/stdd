name: Native prebuilds

on:
  workflow_dispatch:
  # The matrix exercises every helper consumer, so every PR must run it.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-prebuilds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test ${{ matrix.target }} natively
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            binary: native/stdd-fs/target/release/stdd-fs
            artifact: stdd-fs
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: native/stdd-fs/target/release/stdd-fs
            artifact: stdd-fs
          - target: darwin-x64
            runner: macos-15-large
            binary: native/stdd-fs/target/release/stdd-fs
            artifact: stdd-fs
          - target: darwin-arm64
            runner: macos-15
            binary: native/stdd-fs/target/release/stdd-fs
            artifact: stdd-fs
          - target: win32-x64
            runner: windows-2025
            binary: native/stdd-fs/target/release/stdd-fs.exe
            artifact: stdd-fs.exe
          - target: win32-arm64
            runner: windows-11-arm
            binary: native/stdd-fs/target/release/stdd-fs.exe
            artifact: stdd-fs.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Test release helper natively
        working-directory: native/stdd-fs
        run: cargo test --locked --release
      - name: Build release helper natively
        working-directory: native/stdd-fs
        run: cargo build --locked --release
      - name: Strip, stage, probe, and record Unix helper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ matrix.binary }}"
          test -f "$binary"
          strip "$binary"
          artifact_root="$RUNNER_TEMP/native-artifact"
          target_root="$artifact_root/${{ matrix.target }}"
          staged="$target_root/${{ matrix.artifact }}"
          mkdir -p "$target_root"
          cp "$binary" "$staged"
          chmod 0755 "$staged"
          probe_root="$(mktemp -d "$RUNNER_TEMP/stdd-fs-probe.XXXXXX")"
          node scripts/verify-native-prebuilds.mjs \
            --smoke-binary "$staged" \
            --target "${{ matrix.target }}" \
            --probe-root "$probe_root"
          node scripts/native-workflow-scenarios.mjs \
            --helper "$staged" \
            --target "${{ matrix.target }}"
          node scripts/verify-native-prebuilds.mjs \
            --record-binary "$staged" \
            --target "${{ matrix.target }}" \
            --artifact-path "${{ matrix.target }}/${{ matrix.artifact }}" \
            > "$artifact_root/entry.json"
      - name: Stage Cargo-stripped Windows helper, validate PE, probe, and record
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = (Resolve-Path "${{ matrix.binary }}").Path
          $artifactRoot = Join-Path $env:RUNNER_TEMP "native-artifact"
          $targetRoot = Join-Path $artifactRoot "${{ matrix.target }}"
          $staged = Join-Path $targetRoot "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $targetRoot | Out-Null
          Copy-Item -LiteralPath $binary -Destination $staged
          $probeRoot = Join-Path $env:RUNNER_TEMP "stdd-fs-probe"
          New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
          & node scripts/verify-native-prebuilds.mjs `
            --smoke-binary $staged `
            --target "${{ matrix.target }}" `
            --probe-root $probeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & node scripts/native-workflow-scenarios.mjs `
            --helper $staged `
            --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record = & node scripts/verify-native-prebuilds.mjs `
            --record-binary $staged `
            --target "${{ matrix.target }}" `
            --artifact-path "${{ matrix.target }}/${{ matrix.artifact }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText(
            (Join-Path $artifactRoot "entry.json"),
            $record + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Upload Unix helper artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stdd-fs-${{ matrix.target }}
          path: ${{ runner.temp }}/native-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows helper artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stdd-fs-${{ matrix.target }}
          path: ${{ runner.temp }}/native-artifact
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and compare six native prebuilds
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: incoming
      - name: Assemble canonical prebuild tree
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";

          const targets = [
            "darwin-arm64",
            "darwin-x64",
            "linux-arm64",
            "linux-x64",
            "win32-arm64",
            "win32-x64",
          ];
          const expectedArtifacts = targets.map((target) => `stdd-fs-${target}`);
          const actualArtifacts = fs.readdirSync("incoming").sort();
          // This rejects duplicate, missing, and extra build artifacts.
          if (
            actualArtifacts.length !== expectedArtifacts.length ||
            actualArtifacts.some((name, index) => name !== expectedArtifacts[index])
          ) {
            throw new Error(
              `expected artifacts ${expectedArtifacts.join(", ")}, found ${actualArtifacts.join(", ")}`,
            );
          }

          const output = path.join("assembled", "prebuilds", "stdd-fs");
          fs.mkdirSync(output, { recursive: true });
          const manifest = { schema: 1, artifacts: [] };
          const seen = new Set();
          for (const target of targets) {
            const artifactRoot = path.join("incoming", `stdd-fs-${target}`);
            const rootStat = fs.lstatSync(artifactRoot);
            if (!rootStat.isDirectory() || rootStat.isSymbolicLink()) {
              throw new Error(`${artifactRoot} is not a regular directory`);
            }
            const executable = target.startsWith("win32-") ? "stdd-fs.exe" : "stdd-fs";
            const expectedRootEntries = ["entry.json", target].sort();
            const rootEntries = fs.readdirSync(artifactRoot).sort();
            if (
              rootEntries.length !== expectedRootEntries.length ||
              rootEntries.some((name, index) => name !== expectedRootEntries[index])
            ) {
              throw new Error(`${artifactRoot} contains missing or extra files`);
            }
            const targetRoot = path.join(artifactRoot, target);
            const targetStat = fs.lstatSync(targetRoot);
            if (!targetStat.isDirectory() || targetStat.isSymbolicLink()) {
              throw new Error(`${targetRoot} is not a regular directory`);
            }
            const targetEntries = fs.readdirSync(targetRoot);
            if (targetEntries.length !== 1 || targetEntries[0] !== executable) {
              throw new Error(`${targetRoot} contains missing or extra files`);
            }
            const source = path.join(targetRoot, executable);
            const sourceStat = fs.lstatSync(source);
            if (!sourceStat.isFile() || sourceStat.isSymbolicLink()) {
              throw new Error(`${source} is not a regular file`);
            }
            const entry = JSON.parse(fs.readFileSync(path.join(artifactRoot, "entry.json"), "utf8"));
            const keys = Object.keys(entry);
            const expectedKeys = ["target", "protocol", "path", "size", "sha256"];
            if (
              keys.length !== expectedKeys.length ||
              keys.some((key, index) => key !== expectedKeys[index]) ||
              seen.has(entry.target) ||
              entry.target !== target ||
              entry.protocol !== 1 ||
              entry.path !== `${target}/${executable}`
            ) {
              throw new Error(`${artifactRoot}/entry.json is invalid or duplicated`);
            }
            const bytes = fs.readFileSync(source);
            const sha256 = `sha256:${createHash("sha256").update(bytes).digest("hex")}`;
            if (
              entry.size !== bytes.length ||
              entry.sha256 !== sha256 ||
              !/^sha256:[0-9a-f]{64}$/.test(entry.sha256)
            ) {
              throw new Error(`${target} record does not match its helper bytes`);
            }
            seen.add(target);
            const destinationRoot = path.join(output, target);
            const destination = path.join(destinationRoot, executable);
            fs.mkdirSync(destinationRoot);
            fs.copyFileSync(source, destination);
            fs.chmodSync(destination, target.startsWith("win32-") ? 0o644 : 0o755);
            manifest.artifacts.push(entry);
          }
          fs.writeFileSync(
            path.join(output, "manifest.json"),
            JSON.stringify(manifest, null, "\t") + "\n",
          );
          NODE
      - name: Verify assembled prebuilds
        run: node scripts/verify-native-prebuilds.mjs --root assembled
      - name: Upload stdd-fs-prebuilds bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stdd-fs-prebuilds
          path: assembled/prebuilds/stdd-fs
          if-no-files-found: error
          retention-days: 14
      - name: Compare assembled and committed prebuilds
        shell: bash
        run: diff -ru --no-dereference "assembled/prebuilds/stdd-fs" "prebuilds/stdd-fs"
