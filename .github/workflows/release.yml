name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify all committed native helpers and current protocol
        run: node scripts/verify-native-prebuilds.mjs --smoke-current
      - name: Verify npm package contains every native helper
        shell: bash
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          node scripts/verify-native-prebuilds.mjs --check-pack "$RUNNER_TEMP/npm-pack.json"
      - run: npm run check
      - run: npm test
      - run: npm run selfcheck
      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          [ "$pkg" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package ${pkg}"; exit 1; }
      # One tag ships two packages, so each step must survive a rerun after the
      # other failed: the publisher treats this exact version already being on
      # the registry as done. The bundle's version is generated from the root
      # package and asserted by the plugin tests above.
      - name: Publish the CLI (trusted publishing, provenance)
        run: node scripts/publish-package.mjs .
      - name: Publish the universal plugin (trusted publishing, provenance)
        run: node scripts/publish-package.mjs ./plugins/stdd
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
